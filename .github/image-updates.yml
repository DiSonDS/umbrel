# Configuration for scripts/update-app-images.py
#
# Scans app directories matching app_globs that contain both
# docker-compose.yml and umbrel-app.yml.

app_globs:
  - "disonds-*"

# Optional per-app overrides:
# apps:
#   disonds-litellm:
#     ignore_services:
#       - db
#   disonds-voicestudio:
#     platforms:
#       - linux/amd64
apps:
  disonds-voicestudio:
    # CPU/CUDA image is linux/amd64. The arm64 tag is a different NVIDIA image.
    platforms:
      - linux/amd64
