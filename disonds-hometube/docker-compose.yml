version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-hometube_web_1
      APP_PORT: 8501

  web:
    image: ghcr.io/egalitarianmonkey/hometube:v2.9.1@sha256:7880620d7058a3e8a1103cdaa19ffed0acb433dfa4eca35ae188b3e675569114
    restart: on-failure
    user: "1000:1000"
    environment:
      TZ: ${TZ:-UTC}
      UI_LANGUAGE: en
      VIDEOS_FOLDER: /data/videos
      TMP_DOWNLOAD_FOLDER: /data/tmp
      YOUTUBE_COOKIES_FILE_PATH: /config/youtube_cookies.txt
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/hometube:/data/videos
      - ${APP_DATA_DIR}/data/tmp:/data/tmp
      - ${APP_DATA_DIR}/data/config:/config
