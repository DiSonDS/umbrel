version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-hometube_web_1
      APP_PORT: 8501

  web:
    image: ghcr.io/egalitarianmonkey/hometube:v2.13.3@sha256:9d203bb06a7b576a303ec6ec32e2bd39906af422aff0b5bb5ed1e3861e2a1db2
    restart: on-failure
    environment:
      TZ: ${TZ:-UTC}
      UI_LANGUAGE: en
      VIDEOS_FOLDER: /data/videos
      TMP_DOWNLOAD_FOLDER: /data/tmp
      YOUTUBE_COOKIES_FILE_PATH: /config/youtube_cookies.txt
    volumes:
      - ${UMBREL_ROOT}/data/storage/downloads/hometube:/data/videos
      - ${APP_DATA_DIR}/data/tmp:/data/tmp
      - ${APP_DATA_DIR}/data/config:/config
