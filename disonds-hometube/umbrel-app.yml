manifestVersion: 1
id: disonds-hometube
category: media
name: HomeTube
version: "2.13.3"
tagline: Ad-free video & playlist downloader for your media server
description: >-
  HomeTube is a friendly web UI for downloading single videos and playlists
  with the best available quality, then organizing them for Plex, Jellyfin,
  Emby, or local playback.


  Paste a URL, pick quality if you want, and HomeTube handles ads/sponsors,
  subtitles, and smart playlist sync across 1800+ sites (YouTube and more).


  Downloaded videos are saved to Umbrel Downloads under hometube/. For reliable
  YouTube downloads, place cookies in the app's config as youtube_cookies.txt
  (see HomeTube docs).


  Note: Community App Store apps are not vetted by the Umbrel team. Only install
  from stores you trust.
developer: EgalitarianMonkey
website: https://hometube.egalitarianmonkey.com
dependencies: []
repo: https://github.com/EgalitarianMonkey/hometube
support: https://github.com/EgalitarianMonkey/hometube/issues
port: 8510
gallery:
  - https://raw.githubusercontent.com/DiSonDS/umbrel-gallery/main/disonds-hometube/1.png
  - https://raw.githubusercontent.com/DiSonDS/umbrel-gallery/main/disonds-hometube/2.png
  - https://raw.githubusercontent.com/DiSonDS/umbrel-gallery/main/disonds-hometube/3.png
path: ""
defaultUsername: ""
defaultPassword: ""
releaseNotes: >-
  <!-- Release notes generated using configuration in .github/release.yml at
  v2.13.3 --> ## What's Changed ### 🐛 Fixes * fix(download): profile analysis
  builds invalid JSON when yt-dlp reports no filesize by @EgalitarianMonkey in
  https://github.com/EgalitarianMonkey/hometube/pull/185 * fix(integrations):
  Jellyfin 12.4 rejects X-Emby-Token, so the library refresh silently did
  nothing by @Egalitari...

permissions:
  - STORAGE_DOWNLOADS
backupIgnore:
  - data/tmp/*
icon: https://raw.githubusercontent.com/DiSonDS/umbrel-gallery/main/disonds-hometube/icon.svg
submitter: DiSonDS
submission: https://github.com/DiSonDS/umbrel
