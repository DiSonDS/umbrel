version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-litellm_web_1
      APP_PORT: 4000
      # API clients authenticate with LiteLLM virtual/master keys (Bearer),
      # not Umbrel session cookies.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/berriai/litellm-database:v1.108.20@sha256:20857d7d41a66ab79afb947ed21992b9cc533d99ac58622ee5ea1c40009849df
    restart: on-failure
    environment:
      # Master key must start with sk- (API / proxy admin). UI login uses
      # UI_PASSWORD so it matches the plain APP_PASSWORD Umbrel shows.
      LITELLM_MASTER_KEY: sk-${APP_PASSWORD}
      LITELLM_SALT_KEY: sk-${APP_SEED}
      UI_USERNAME: admin
      UI_PASSWORD: ${APP_PASSWORD}
      DATABASE_URL: postgresql://litellm:${APP_PASSWORD}@disonds-litellm_db_1:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine@sha256:f2f98726820d0342055351c6e9d36e705f5bfffb3dd53ff556325114b08afb6d
    restart: on-failure
    user: "1000:1000"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      PGUSER: litellm
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
      start_period: 20s
      interval: 10s
