version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-litellm_web_1
      APP_PORT: 4000
      # API clients authenticate with LiteLLM virtual/master keys (Bearer),
      # not Umbrel session cookies.
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/berriai/litellm-database:v1.101.0@sha256:070df884f52600352a4aedda059180be141f3645c61c59b89b0ee35c17a4ea84
    restart: on-failure
    environment:
      # Master key must start with sk- (API / proxy admin). UI login uses
      # UI_PASSWORD so it matches the plain APP_PASSWORD Umbrel shows.
      LITELLM_MASTER_KEY: sk-${APP_PASSWORD}
      LITELLM_SALT_KEY: sk-${APP_SEED}
      UI_USERNAME: admin
      UI_PASSWORD: ${APP_PASSWORD}
      DATABASE_URL: postgresql://litellm:${APP_PASSWORD}@disonds-litellm_db_1:5432/litellm
      STORE_MODEL_IN_DB: "True"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python3 -c "import urllib.request; urllib.request.urlopen('http://localhost:4000/health/liveliness')"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  db:
    image: postgres:16-alpine@sha256:3c5c8892d184f738f4fe282d14ddaa613a38f00f4189d2d94725ebe6f2909ddb
    restart: on-failure
    user: "1000:1000"
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${APP_PASSWORD}
      PGUSER: litellm
    volumes:
      - ${APP_DATA_DIR}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready
      start_period: 20s
      interval: 10s
