version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-torrserver_web_1
      APP_PORT: 8090
      # Companion clients (TorrServe, VLC, players) cannot send Umbrel auth cookies
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/yourok/torrserver:MatriX.145.2@sha256:0addb0095f17e42885b7e90154aca63c601c720c269d7f7978d14d530abbabc1
    restart: on-failure
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/ts/config
      - ${UMBREL_ROOT}/data/storage/downloads/torrserver:/opt/ts/torrents
