version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-torrserver_web_1
      APP_PORT: 8090
      # Companion clients (TorrServe, VLC, players) cannot send Umbrel auth cookies
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/yourok/torrserver:MatriX.144.3@sha256:918ce341bf64650dcdae98fed27b11962f38d6efae28bf0da48d4eeffb44040e
    restart: on-failure
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/ts/config
      - ${UMBREL_ROOT}/data/storage/downloads/torrserver:/opt/ts/torrents
