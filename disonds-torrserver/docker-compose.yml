version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-torrserver_web_1
      APP_PORT: 8090
      # Companion clients (TorrServe, VLC, players) cannot send Umbrel auth cookies
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/yourok/torrserver:MatriX.144.1@sha256:4bf54fbd0cc095cdca8d854f95afee4223072ab7fdf378d0da50e5bb86dd8e77
    restart: on-failure
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/ts/config
      - ${UMBREL_ROOT}/data/storage/downloads/torrserver:/opt/ts/torrents
