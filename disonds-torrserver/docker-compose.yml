version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-torrserver_web_1
      APP_PORT: 8090
      # Companion clients (TorrServe, VLC, players) cannot send Umbrel auth cookies
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/yourok/torrserver:MatriX.147.2@sha256:056e0cf1003c4e6c2c2343797f84734fe4dc48f57d1ed18af6d5ef982fce0f40
    restart: on-failure
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/ts/config
      - ${UMBREL_ROOT}/data/storage/downloads/torrserver:/opt/ts/torrents
