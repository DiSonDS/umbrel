version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: disonds-torrserver_web_1
      APP_PORT: 8090
      # Companion clients (TorrServe, VLC, players) cannot send Umbrel auth cookies
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/yourok/torrserver:MatriX.151@sha256:6adc851f5ce2f523b6b95998f1fdb1e172deef1c001c1419abcdc5788d77be5a
    restart: on-failure
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
      TS_HTTPAUTH: "0"
    volumes:
      - ${APP_DATA_DIR}/data/config:/opt/ts/config
      - ${UMBREL_ROOT}/data/storage/downloads/torrserver:/opt/ts/torrents
